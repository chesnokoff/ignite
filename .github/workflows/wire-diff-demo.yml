name: Wire format diff demo

on:
  pull_request:
    branches: [demo/wire-diff-base-20261105]

permissions:
  contents: read

concurrency:
  group: wire-diff-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-wire:
    name: Compare wire format descriptions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
        with:
          path: merge
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the target revision used in the test merge
        run: git -C merge worktree add --detach "$GITHUB_WORKSPACE/base" HEAD^1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build wire descriptions
        run: |
          for version in base merge; do
            (
              cd "$version"
              rm -rf modules/wire-compatibility-check/wire
              ./mvnw -B -ntp clean test-compile -pl modules/wire-compatibility-check -am -T 1C
            )
            wire="$version/modules/wire-compatibility-check/target/classes/META-INF/ignite-wire"
            if [ ! -f "$wire/ids.json" ]; then wire="$version/modules/wire-compatibility-check/wire"; fi
            mv "$wire" "$version-wire"
          done
      - name: Compare descriptions and publish summary
        id: compare
        run: |
          BASE_SHA=$(git -C base rev-parse HEAD)
          status=0
          diff -ruN base-wire merge-wire > wire.diff || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          echo "changed=$status" >> "$GITHUB_OUTPUT"
          exec >> "$GITHUB_STEP_SUMMARY"
          echo "## Wire diff: target branch $BASE_SHA → PR merge $GITHUB_SHA"
          if [ "$status" = 0 ]; then echo 'No wire format changes.'; exit 0; fi
          echo '::warning::Wire format changed. Review the job summary before approval.' >&2
          echo 'Preview: first 200 KB. Complete diff: wire-diff artifact.'
          echo '```diff'
          head -c 200000 wire.diff
          printf '\n```\n'
      - uses: actions/upload-artifact@v4
        if: steps.compare.outputs.changed == '1'
        with:
          name: wire-diff
          path: wire.diff
          retention-days: 14
