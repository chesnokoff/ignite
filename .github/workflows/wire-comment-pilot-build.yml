name: Wire comment pilot build
on:
  pull_request:
    paths: ['pilot/wire-comment/**']
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compare synthetic wire descriptions
        run: |
          mkdir -p "$RUNNER_TEMP/wire-comment"
          rc=0
          diff -u --label base/ExampleMessage.json --label head/ExampleMessage.json \
            pilot/wire-comment/before.json pilot/wire-comment/after.json \
            > "$RUNNER_TEMP/wire-comment/wire.diff" || rc=$?
          test "$rc" -le 1
      - uses: actions/upload-artifact@v4
        with:
          name: wire-comment-pilot
          path: ${{ runner.temp }}/wire-comment/wire.diff
          retention-days: 7
